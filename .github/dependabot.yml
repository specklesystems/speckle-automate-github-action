version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    # The pins of specklesystems/.github move together, after the cooldown that
    # only speckle-next skips (ADR-0002 amendment of 2026-11-24).
    groups:
      dot-github:
        patterns:
          - specklesystems/.github/*

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
