# Betterleaks secret scanner config, used by the `secret-scan` workflow. The built-in
# rules apply (`[extend]` below); `filter` only discards findings, and a finding is
# discarded when the expression is true.
#
# Setting `filter` replaces the built-in global filter instead of adding to it
# (betterleaks 1.10.0). Its discards of placeholder values such as `$VAR` no longer
# apply; each built-in rule's own filter still does.
title = "speckle-automate-github-action betterleaks config"

filter = '''
let path = attributes["path"];
let rule = finding["rule_id"];
let secret = finding["secret"];
let generic = rule in ["generic-api-key", "generic-credential-uri", "generic-password"];

// Bundled source map of the action: an example password in a dependency's docs.
(rule == "generic-password" && secret == "password" && matchesAny(path, [`(?:^|/)dist/.*\.map$`]))
'''

[extend]
useDefault = true
